id: http://w3id.org/linkml/examples/coderdata
name: coderdata
prefixes:
   linkml: https://w3id.org/linkml
   coderdata: https://w3id.org/linkml/examples/coderdata
   schema: http://schema.org/
imports:
   - linkml:types
default_range: string
default_prefix: coderdata

slots:
  entrez_id:
    description: Gene id according to NCBI
    range: integer
  phosphosite_id:
    description: Unique identifier for a phosphorylation site (gene + residue + position)
    identifier: true
    range: integer
  improve_sample_id:
    description: Unique sample identifier for this dataset, generated by this package
    identifier: true
    slot_uri: schema:identifier
    range: integer
  improve_drug_id:
    description: Unique identifier for this dataset, one for each smile string.
    identifier: true
    slot_uri: schema:identifier
  time:
    range: float
    description: Time at which measurement was administered, unit below.
  time_unit:
    description: Unit of time in which drug treatment was measured, e.g. minutes, hours, weeks.
  source:
    description: Source of data generated. 
  study:
    description: Study informatiom identifying where/when data was collected.
  other_id:
    description: other identifier
    recommended: true
    range: linkml:Any
  other_id_source:
    description: source of other identifier

classes:
  Gene:
    description: All genes used in coderdata
    slots:
      - entrez_id
      - other_id
      - other_id_source
    attributes:
      gene_symbol:
        required: true
        description: HGNC Gene symbol or synomym
  Phosphosite:
    description: Reference table of phosphorylation sites; each row is a unique gene + residue + position combination.
    slots:
      - phosphosite_id
      - entrez_id
      - other_id
      - other_id_source
    attributes:
      gene_symbol:
        required: true
        description: HGNC gene symbol
      residue:
        description: Phosphorylated amino acid residue (S, T, or Y)
      position:
        range: integer
        description: Position of the residue in the canonical protein sequence
      modification:
        description: Type of modification (e.g. phospho)
  Sample:
    description: Unique samples identified for each experiment, used to cross reference omics data to drug data.
    slots:
      - improve_sample_id
      - other_id
      - other_id_source
    attributes:
      common_name:
        description: name for drug
        range: linkml:Any
      cancer_type:
        description: Type of cancer
      other_names:
        description: Other name for sample
        range: linkml:Any
      species:
        description: Species
      model_type:
        description: Type of model, must be confined to our existing set of definitions
        range: Models
  Drug:
    description: List of chemicals/drugs used in the data package. Each identifer corresponds to a distinct structure.
    slots:
      - improve_drug_id
    attributes:
      chem_name:
        description: Name of drug
        range: linkml:Any
      canSMILES:
        description: Canonical SMILE string
      isoSMILES:
        description: Isomeric SMILE string
      InChIKey:
        description: InChIKey
      formula:
        description: Chemical formula
      weight:
        description: Molecular weight
        range: linkml:Any
      pubchem_id:
        description: PubChem Identifier for this drug, can be many.
        range: int
  Drug Descriptor:
    description: Computational summary of drug chemical properties
    slots:
      - improve_drug_id
    attributes:
      structural_descriptor:
        description: string name describing structural descriptor
      descriptor_value:
        range: linkml:Any
        description: value representing descriptor value
  Transcriptomics:
    description:
    slots:
      - entrez_id
      - improve_sample_id
      - source
      - study
    attributes:
      transcriptomics:
         range: float
         description: Transcripts per million of sample at baseline.
  Proteomics:
    slots:
      - entrez_id
      - improve_sample_id
      - source
      - study
    attributes:
      proteomics:
         range: float
         description: Log-normalized log ratio of proteomics measurements of sample at baseline.
  Phosphoproteomics:
    slots:
      - phosphosite_id
      - improve_sample_id
      - source
      - study
    attributes:
      phosphoproteomics:
        range: float
        description: Log-normalized, batch-corrected phosphoproteomics abundance value (correctedAbundance).
  Copy Number:
    slots:
      - entrez_id
      - improve_sample_id
      - source
      - study
    attributes:
      copy_number:
        range: float
        description: Copy number measurements of sample at baseline
      copy_call:
        range: CopyCall
        description: Categorical variable defining copy number measurement.
  Mutations:
    slots:
      - entrez_id
      - improve_sample_id
      - source
      - study
    attributes:
      mutation:
        description: Description of the mutation, when available. 
      variant_classification:
        description: Classification of the variant
        range: Variant
  Experiments:
    slots:
      - improve_drug_id
      - improve_sample_id
      - source
      - study
      - time
      - time_unit
    attributes:
      dose_response_metric:
        range: ResponseMetric
        description: Metric by which dose response value is measured
      dose_response_value:
        description: Value of metric
        range: linkml:Any
  Perturbations:
    slots:
      - entrez_id
      - improve_sample_id
      - time
      - time_unit
      - source
      - study
    attributes:
      data_value:
        range: float
        description: Response value of the gene
      data_type:
        description: The value represented in the data value
      perturbation:
        description: Drug or gene id that was perturbed
        range: integer
      perturbation_type:
        description: The perturbagen that was used
        range: CellPerturbation
  Combinations:
    slots:
      - improve_sample_id
      - source
      - study
      - time
      - time_unit
    attributes:
      improve_drug_1:
        description: improve_drug_id of first drug
      improve_drug_2:
        description: imrrove_drug_id of second drug
      drug_combination_metric:
        description: metric calculated for synergy, or other metric of two drugs
      drug_combination_value:
        range: linkml:Any
        description: value of metric for synergy or combination
enums:
  ResponseMetric:
    permissible_values:
      fit_auc:
        description: Area under the fitted hill slope curve across the common interval of -log10[M], where the molar concentration (M) ranges from 10^-4 to 10^-10.
      fit_ic50:
        description: The fitted curve prediction of the -log10M concentration required to reduce tumor growth by 50%.
      fit_ec50:
        description: The fitted curve prediction of the -log10M concentration at which 50% of the maximal effect is observed.
      fit_ec50se:
        description: Standard error of the fit_EC50 estimate.
      fit_einf:
        description: The fraction of cells that are unaffected even at an infinite dose concentration. Calculated as the lower asymptote of the hill slope function.
      fit_hs:
        description: The estimated hill slope binding cooperativity, calculated as the slope of the sigmoidal hill curve.
      fit_r2:
        description: Coefficient of determination between observed growth and the fitted hill slope curve, indicating goodness of fit.
      aac:
        description: Area above the response curve; the complement value of AUC.
      auc:
        description: Area under the fitted hill slope curve across all doses present. Lower AUC signifies lower levels of growth.
      dss:
        description: A multiparametric dose response value, that takes into account control and treated cells; the Drug Sensitivity Score is described in Yadav et al., 2014.
      mrecist:
        description: "Disease status is classified into four categories: PD (progressive disease), SD (stable disease), PR (partial response), and CR (complete response). This is calculated as Day 10 percent volume change (%ΔV) and its cumulative average response under the following methods: CR if best %ΔV < -95% and avg < -40%, PR if %ΔV < -50% and avg < -20%, SD if %ΔV < +35% and avg < +30%, otherwise PD."
      published_auc:
        description: AUC that has been published with the study. Currently used in organoid data.
      gc_auc:
        description: Area under tumor growth curve
      efs:
        description: event free survival
      os:
        description: overall survival
      tgi:
        description: The tumor growth inhibition (TGI) between the control and treatment time-volume curves.
      kulgap:
        description: kl divergence based metric
      abc:
        description: Area between curves for PDX in-vivo response
      lmm:
        description: Linear mixed model coefficient for PDX tumor growth response
      uM_viability:
        description:
          Single-dose viability fraction at 1 μM. Values near 1.0 indicate no
          effect (full viability); values near 0.0 indicate full kill. Values
          above 1.0 are possible when treated cells proliferate beyond the
          untreated control. Used for organoid drug screens where dose-response
          curves were not collected for that drug.
      delta_auc:
        description: Difference in AUC between single-drug and combination treatment; used for MPNST treated-microtissue combination experiments.
  CellPerturbation:
    permissible_values:
      gene_ko:
        description: Gene loss via CRISPR or other screen
      drug:
        description: Drug treatment
  Models:
    permissible_values:
      cell line:
      organoid:
      tumor:
      patient derived xenograft:
      xenograft derived organoid:
      patient derived organoid:
      ex vivo:
      normal_tissue:
      3D-MEDS:
  Variant:
    permissible_values:
      3'UTR:
      3'Flank:
      5'Flank:
      5'UTR:
      Undetermined:
      De_novo_Start_InFrame:
      De_novo_Start_OutOfFrame:
      Frame_Shift_Del:
      Frame_Shift_Ins:
      Frameshift_Variant:
      Protein_Altering_Variant:
      IGR:
      In_Frame_Del:
      In_Frame_Ins:
      Intron:
      Missense_Mutation:
      Nonsense_Mutation:
      Nonstop_Mutation:
      RNA:
      Start_Codon_SNP:
      Start_Codon_Del:
      Start_Codon_Ins:      
      Stop_Codon_Del:
      Stop_Codon_Ins:
      Silent:
      Splice_Site:
      Splice_Region:
      Translation_Start_Site:
  CopyCall:
    permissible_values:
      amp:
      gain:
      diploid:
      het loss:
      deep del:
